<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NGO Login | Food For Good</title>

    <link rel="stylesheet" href="role-login.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
          rel="stylesheet">

</head>


<body>


    <header class="navbar">

        <div class="logo">

            <span class="logo-mark">
                F
            </span>

            Food For Good

        </div>


        <a href="login.html"
           class="back">

            ← Back

        </a>

    </header>



    <main class="login-page">


        <div class="login-box">


            <div class="role-icon ngo-icon">
                🤝
            </div>


            <span class="role-label">
                FOOD RECEIVING ORGANIZATION
            </span>


            <h1>
                NGO Login
            </h1>


            <p class="intro">
                Login to discover available food,
                request donations and manage collection.
            </p>



            <form>


                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    placeholder="Enter your email"
                    required
                >



                <label>
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >



                <div class="options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>



                <button type="submit">

                    Login as NGO

                    <span>→</span>

                </button>


            </form>



            <p class="bottom-text">

                Don't have an NGO account?

                <a href="ngo-signup.html">
                    Create Account
                </a>

            </p>


        </div>


    </main>


</body>

</html>
