<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Food For Good</title>

    <link rel="stylesheet" href="role-login.css">

 

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
          rel="stylesheet">

</head>


<body>


    <header class="navbar">

        <div class="logo">

            <span class="logo-mark">
                F
            </span>

            Food For Good

        </div>


        <a href="login.html"
           class="back">

            ← Back

        </a>

    </header>



    <main class="login-page">


        <div class="login-box">


            <div class="role-icon admin-icon">
                🛡️
            </div>


            <span class="role-label">
                PLATFORM MANAGEMENT
            </span>


            <h1>
                Admin Login
            </h1>


            <p class="intro">
                Login to manage users, food listings,
                requests and platform reports.
            </p>



            <form>


                <label>
                    Admin Email
                </label>

                <input
                    type="email"
                    placeholder="Enter admin email"
                    required
                >



                <label>
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Enter admin password"
                    required
                >



                <div class="options">

                    <label class="remember">

                        <input type="checkbox">

                        Remember me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>



                <button type="submit">

                    Login as Admin

                    <span>→</span>

                </button>


            </form>



            <p class="admin-note">

                Admin accounts are created by
                the platform administrator.

            </p>


        </div>


    </main>


</body>

</html>
